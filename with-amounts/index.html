<style>
  :root {
    --sky: #050D2B;
    --ink: #0B1733;
    --soft: #A9C4F5;
    --line: rgba(255, 255, 255, 0.22);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: #FFFFFF;
    font-family: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(1200px 520px at 50% -160px, rgba(47, 123, 255, 0.42), rgba(5, 13, 43, 0) 70%),
      var(--sky);
    background-repeat: no-repeat;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    max-width: 1280px;
    margin: 0 auto;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #FFFFFF;
    text-decoration: none;
  }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .tag {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--soft);
    white-space: nowrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    background: #FFFFFF;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #EAF2FF; }
  .btn:focus-visible, .brand:focus-visible, .foot a:focus-visible {
    outline: 2px solid #8DB6FF;
    outline-offset: 3px;
  }
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 6px 24px 40px;
    display: grid;
    gap: 28px;
  }
  .slide {
    position: relative;
    margin: 0;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #0A2470;
    border: 1px solid var(--line);
    box-shadow: 0 34px 80px -44px rgba(0, 0, 0, 0.9);
    container-type: inline-size;
    scroll-margin-top: 16px;
  }
  .slide img {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* the launch spot sits exactly over its still on the marketing slide */
  .slide video {
    position: absolute;
    left: 43.281%;
    top: 11.944%;
    width: 50%;
    height: 50%;
    border-radius: 8px;
    border-radius: 1.04cqw;
    background: #050D2B;
    object-fit: cover;
  }
  .foot {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px 56px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 14px;
    line-height: 1.5;
    color: var(--soft);
  }
  .foot a { color: #FFFFFF; }
  @media (max-width: 640px) {
    .bar { padding: 16px 12px; }
    .tag { display: none; }
    main { padding: 2px 12px 28px; gap: 14px; }
    .slide { border-radius: 8px; }
    .foot { padding: 0 12px 40px; }
  }
</style>
</head>

<script>
  // Left and right arrows step between slides.
  (function () {
    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      if (e.target && /^(VIDEO|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      var mid = scrollY + innerHeight / 2, at = 0;
      slides.forEach(function (s, i) { if (s.offsetTop <= mid) at = i; });
      var next = slides[Math.max(0, Math.min(slides.length - 1, at + (e.key === 'ArrowRight' ? 1 : -1)))];
      if (next) { e.preventDefault(); next.scrollIntoView({ block: 'center' }); }
    });
  })();
</script>
